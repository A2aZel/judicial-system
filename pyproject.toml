[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "judicial-ai"
version = "0.5.1"
description = "Structured judicial case analysis without generative models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.14",
  "uvicorn==0.32.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "numpy==2.4.6",
  "torch==2.13.0",
  "transformers==5.14.1",
  "sentence-transformers==5.6.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["judicial_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
