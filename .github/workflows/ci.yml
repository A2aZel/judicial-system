name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r requirements-dev-lock.txt
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/test_ui.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: judicial-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test running image
        run: |
          docker run --detach --name judicial-ci --publish 127.0.0.1:8000:8000 \
            --env JUDICIAL_AI_CORPUS_PATH=/app/fixtures/synthetic_analysis.csv \
            --env JUDICIAL_AI_BERT_RISK_ENABLED=false judicial-ai:ci
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/api/v1/health; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          python3 tools/docker_smoke.py --base-url http://127.0.0.1:8000
      - name: Show container logs on failure
        if: failure()
        run: docker logs judicial-ci || true
      - name: Remove smoke container
        if: always()
        run: docker rm --force judicial-ci || true
