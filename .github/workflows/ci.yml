name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r requirements-dev-lock.txt
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/test_ui.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: judicial-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test application inside image
        run: docker run --rm judicial-ai:ci python -c "from fastapi.testclient import TestClient; from app import app; client=TestClient(app); response=client.get('/api/v1/health'); assert response.status_code == 200; print(response.json())"
