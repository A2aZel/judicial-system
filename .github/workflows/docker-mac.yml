name: Docker Mac CPU

on:
  push:
    branches: [main, feat/docker-mac-knn]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-mac-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/a2azel/judicial-system

jobs:
  build-and-smoke:
    name: Build and smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build native CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: judicial-ai:mac-smoke
          labels: |
            org.opencontainers.image.source=https://github.com/A2aZel/judicial-system
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-mac-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-mac-${{ matrix.arch }}
      - name: Smoke test running image with synthetic records
        shell: bash
        run: |
          docker run --detach --name judicial-mac-smoke \
            --publish 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --security-opt no-new-privileges --memory 4g --cpus 2 \
            --env JUDICIAL_AI_CORPUS_PATH=/app/fixtures/synthetic_analysis.csv \
            --env JUDICIAL_AI_BERT_RISK_ENABLED=false \
            judicial-ai:mac-smoke
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/api/v1/health; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          python3 tools/docker_smoke.py --base-url http://127.0.0.1:8000
          docker exec judicial-mac-smoke python -c 'import torch; assert torch.version.cuda is None; print("CPU-only PyTorch:", torch.__version__)'
      - name: Log in to GHCR after successful smoke
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image and record digest
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image_ref="$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker tag judicial-ai:mac-smoke "$image_ref"
          docker push "$image_ref"
          canonical=$(docker image inspect "$image_ref" --format '{{index .RepoDigests 0}}')
          test "${canonical%@*}" = "$IMAGE"
          digest="${canonical##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/digests/$ARCH.txt"
      - name: Share tested digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Show container logs on failure
        if: failure()
        run: docker logs judicial-mac-smoke || true
      - name: Remove smoke container
        if: always()
        run: docker rm --force judicial-mac-smoke || true

  publish-manifest:
    name: Publish tested multi-platform image
    needs: build-and-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and verify both tested architectures
        shell: bash
        run: |
          digest_dir="$RUNNER_TEMP/digests"
          test "$(find "$digest_dir" -type f | wc -l)" -eq 2
          amd64=$(cat "$digest_dir/amd64.txt")
          arm64=$(cat "$digest_dir/arm64.txt")
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$amd64" != "$arm64"
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --raw > "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" "$amd64" "$arm64" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              manifests = json.load(source)["manifests"]
          expected = {"amd64": sys.argv[2], "arm64": sys.argv[3]}
          assert len(manifests) == 2, manifests
          actual = {}
          for manifest in manifests:
              assert manifest["platform"]["os"] == "linux", manifest
              actual[manifest["platform"]["architecture"]] = manifest["digest"]
          assert actual == expected, actual
          print("Verified tested linux/amd64 and linux/arm64 digests")
          PY
          docker buildx imagetools create \
            --tag "$IMAGE:mac8gb" "$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools inspect "$IMAGE:mac8gb"
